name: Deploy Flask App to Touge Server
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install dependencies and run tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==8.4.1
          pytest tests/ -v
        continue-on-error: false
      - name: Deploy to Touge Server via SSH
        env:
          TOUGE_SERVER_IP: ${{ secrets.TOUGE_SERVER_IP }}
          TOUGE_SERVER_PORT: ${{ secrets.TOUGE_SERVER_PORT }}
          TOUGE_SSH_PRIVATE_KEY: ${{ secrets.TOUGE_SSH_PRIVATE_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf "%s\n" "$TOUGE_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          SSH_OPTS="-o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa"
          ssh-keyscan -p "$TOUGE_SERVER_PORT" -H "$TOUGE_SERVER_IP" >> ~/.ssh/known_hosts

          echo "同步代码到服务器（rsync）..."
          rsync -avz --delete \
            --exclude .git --exclude __pycache__ --exclude .venv --exclude .pytest_cache \
            -e "ssh -p $TOUGE_SERVER_PORT $SSH_OPTS" \
            ./ "root@$TOUGE_SERVER_IP:/root/flask-web-app/"

          echo "安装依赖并重启应用..."
          ssh -p "$TOUGE_SERVER_PORT" $SSH_OPTS "root@$TOUGE_SERVER_IP" << 'EOF'
            set -e
            cd /root/flask-web-app
            pip3 install -r requirements.txt || echo "依赖安装失败(已有环境，忽略)"
            supervisorctl restart flask-web-app
            supervisorctl status flask-web-app
            echo "本地 HTTP 验证："
            curl -s -m 5 http://127.0.0.1:5000/ ; echo
            echo "部署完成"
          EOF
